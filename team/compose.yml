# Восточно-Жезказганский рудник (ВЖР): overlay к deploy/compose/docker-compose.yml.
# Started by `make mine` from the repository root. Paths are relative to
# deploy/compose (the first compose file), like examples/mine/compose.yml.

services:
  # Создаёт или обновляет 166 двойников горизонта в Ditto и завершается.
  mine-setup:
    build: ../../team
    image: openegiz/vzhr:local
    restart: "no"
    command: ["python", "-m", "mine.setup_twins"]
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
    depends_on:
      init:
        condition: service_completed_successfully

  # Симулятор горизонта: вентиляция, газы, горное давление, цикл камер, наряд.
  # Публикует сообщения протокола Ditto в MQTT; слушает команды сценариев.
  mine-sim:
    image: openegiz/vzhr:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 192m
    command: ["python", "-m", "mine.run_sim"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SIM_SPEEDUP: ${SIM_SPEEDUP:-20}
      SIM_INTERVAL: ${SIM_INTERVAL:-2}
    depends_on:
      mine-setup:
        condition: service_completed_successfully

  # План горизонта (2D, из Ditto), наряд мастера и сценарии «что если».
  # Состояние читает из платформы: Ditto search API при старте, затем события
  # Ditto из MQTT. Команды уходят симулятору через MQTT.
  mine-control:
    image: openegiz/vzhr:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 192m
    command: ["python", "-m", "mine.control"]
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      PORT: "8095"
    ports:
      - "${OPENEGIZ_BIND:-127.0.0.1}:${MINE_PORT:-8095}:8095"
    depends_on:
      mine-setup:
        condition: service_completed_successfully

  grafana:
    environment:
      # дашборд «План горизонта» встраивает живую страницу плана через iframe
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
    volumes:
      # the platform mounts provisioning/ read-only, so a single file cannot be
      # added inside it; replace the dashboards provider directory instead
      # (it carries a copy of the platform's own openegiz.yaml plus ours)
      - ../../team/grafana/provisioning:/etc/grafana/provisioning/dashboards:ro
      - ../../team/grafana/dashboards:/var/lib/grafana/vzhr-dashboards:ro
